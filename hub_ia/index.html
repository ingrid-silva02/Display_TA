<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de @Media</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/responsive.css">

    <!-- estilo da pagina -->
    <!-- () são os parametros 
    @media= tela a partir de 480px-->
    <!--break point 
    sempre coloque as medias do menor para o maior  -->
    <style>
        * {
            margin-top: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            background-color: deeppink;
        }

        .conteiner{
            width:100%;
            display:flex;
            gap: 15px;
        }

        .box{
            width: 400px;
            height: 200px;
            background-color:black;
        }

        @media(min-width: 768px) {
            body {
                background-color: #f74799;
            }
        }

        @media (max-width: 480px) {
            body {
                background-color: #f7c7cf;
            }
        }
    </style>
</head>

<body>
    <h1>Teste com CSS @Media Query</h1>
    <div class="conteiner">
        

        <div class="box"> </div>
        <div class="box"> </div>
        <div class="box"> </div>
        <div class="box"> </div>
    </div>
</body>

</html>
